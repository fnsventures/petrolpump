<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Bishnupriya Fuels</title>
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
    <meta name="theme-color" content="#0070c0" />
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --bpcl-blue: #0070c0;
        --bpcl-blue-dark: #005a9c;
        --text: #0f172a;
        --muted: #64748b;
        --surface: #ffffff;
        --bg: #f8fafc;
        --border: #e2e8f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .card {
        width: min(26rem, 100%);
        padding: 1.75rem 1.5rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--bpcl-blue) 0%, var(--bpcl-blue) 38%, #ffcc00 38%, #ffcc00 100%);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--bpcl-blue);
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: var(--muted);
      }
      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        padding: 0.65rem 1.25rem;
        font: inherit;
        font-weight: 600;
        font-size: 0.9375rem;
        color: #fff;
        background: var(--bpcl-blue);
        cursor: pointer;
      }
      button:hover {
        background: var(--bpcl-blue-dark);
      }
      .links {
        margin-top: 1rem;
        font-size: 0.8125rem;
      }
      .links a {
        color: var(--bpcl-blue);
        text-decoration: none;
        font-weight: 600;
      }
      .links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <h1>You are offline</h1>
      <p>
        BPFuels needs a network connection for live pump data. Reconnect, then try again.
        Pages you already opened may still work from cache.
      </p>
      <button type="button" id="retry-btn">Try again</button>
      <p class="links">
        <a href="dashboard.html">Dashboard</a>
        ·
        <a href="login.html">Sign in</a>
      </p>
    </main>
    <script>
      document.getElementById("retry-btn")?.addEventListener("click", () => {
        window.location.reload();
      });
      window.addEventListener("online", () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
