name: Purge audit log

# Manual runs delete rows older than 3, 2, or 1 month, or a number of days
# (30 or more). They do not upload a backup.
# After the scheduled Backup production database workflow succeeds, this workflow
# deletes rows older than 1 month. A failed or hand-started backup does not.
on:
  workflow_dispatch:
    inputs:
      keep_months:
        description: Months to keep. Ignored when Days to keep is filled in.
        type: choice
        required: true
        options:
          - "1"
          - "2"
          - "3"
        default: "1"
      keep_days:
        description: Days to keep (30 or more). Leave blank to use the months choice.
        type: string
        required: false
        default: ""
      confirm:
        description: Dry run counts rows. Delete removes them on production.
        type: choice
        required: true
        options:
          - dry-run
          - delete
        default: dry-run
  workflow_run:
    workflows: ["Backup production database"]
    types:
      - completed

concurrency:
  group: prod-audit-purge
  cancel-in-progress: false

jobs:
  purge-after-backup:
    name: Delete audit rows older than 1 month
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Purge audit log older than 1 month
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          AUDIT_KEEP_MONTHS: "1"
          CONFIRM_PURGE_AUDIT: yes
        run: bash scripts/purge-audit-log.sh

  purge:
    name: Purge audit log
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Purge audit log
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          AUDIT_KEEP_MONTHS: ${{ inputs.keep_months }}
          AUDIT_KEEP_DAYS: ${{ inputs.keep_days }}
          CONFIRM_PURGE_AUDIT: ${{ inputs.confirm == 'delete' && 'yes' || '' }}
        run: bash scripts/purge-audit-log.sh
