name: Purge audit log

# Weekly: delete production audit_log rows older than 6 months.
# The monthly backup archives each finished month's audit rows to Drive long
# before they reach that age. Operational tables are not touched.
# Manual runs delete rows older than 3, 2, or 1 month and do not upload a backup.

on:
  schedule:
    # Sundays 03:30 UTC (09:00 IST)
    - cron: "30 3 * * 0"
  workflow_dispatch:
    inputs:
      keep_months:
        description: Delete production audit_log rows older than
        type: choice
        required: true
        options:
          - "3"
          - "2"
          - "1"
        default: "3"
      confirm:
        description: Dry run counts rows. Delete removes them on production.
        type: choice
        required: true
        options:
          - dry-run
          - delete
        default: dry-run

concurrency:
  group: prod-db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  purge:
    # Schedule: older than 6 months, delete. Manual: the chosen age, dry run unless "delete".
    name: >-
      ${{ github.event_name == 'schedule' && 'Delete audit rows older than 6 months' ||
          format('Audit rows older than {0} month(s) · {1}', inputs.keep_months, inputs.confirm) }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Purge audit log
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          AUDIT_KEEP_MONTHS: ${{ github.event_name == 'schedule' && '6' || inputs.keep_months }}
          CONFIRM_PURGE_AUDIT: ${{ (github.event_name == 'schedule' || inputs.confirm == 'delete') && 'yes' || '' }}
        run: bash scripts/purge-audit-log.sh
