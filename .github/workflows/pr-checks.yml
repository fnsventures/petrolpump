name: PR checks

# Fast gate on every PR into staging/main. Nothing here touches Supabase or secrets.

on:
  pull_request:
    branches: [staging, main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter lists PR files via the API

jobs:
  build:
    name: Build site + JS syntax + doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: CSS colours (no new hardcoded colours)
        run: npm run lint:css

      - name: ESLint (undeclared globals)
        run: npm run lint:js

      # // @ts-check files against types/db.d.ts: wrong table, column or RPC argument fails here.
      - name: Type check
        run: npm run typecheck

      - name: JS syntax
        run: |
          set -euo pipefail
          git ls-files 'js/*.js' 'scripts/*.mjs' ':!js/vendor/**' | xargs -n1 node --check

      # Same script and file list as Deploy, so a green PR build means the deploy build works.
      - name: Build like deploy (no secrets)
        run: |
          set -euo pipefail
          cp js/env.example.js js/env.js
          node scripts/build-deploy.mjs prod "$RUNNER_TEMP/site"
          node scripts/build-deploy.mjs staging "$RUNNER_TEMP/site"

      - name: Doc links
        run: node scripts/check-doc-links.mjs

  migrations:
    name: Migration names + order + function sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check order against base branch
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash scripts/check-migration-order.sh

      # Plain Node, no npm deps (runner's preinstalled Node).
      - name: functions-sql matches schema.sql and newest migration
        run: node scripts/sql-functions.mjs check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No secret or dump files tracked
        run: bash scripts/check-forbidden-files.sh

      # Scans every commit in this PR (base..head), not only the final tree, so a key
      # added and then deleted in a later commit is still caught. Config: .gitleaks.toml.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="${RANGE}" --config .gitleaks.toml

  db:
    name: Database (schema drift, pgTAP, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            db:
              - 'supabase/migrations/**'
              - 'supabase/schema.sql'
              - 'supabase/tests/**'
              - 'types/db.d.ts'
              - 'scripts/check-schema-drift.sh'
              - 'scripts/test-db.sh'
              - 'scripts/gen-db-types.sh'

      # Each step starts its own throwaway Postgres in Docker (same image, pulled once);
      # no Supabase project or secrets. Steps run in this order so the first failure is the
      # most basic one: schema.sql wrong → tests → generated types.
      - name: schema.sql matches migrations
        if: steps.changes.outputs.db == 'true'
        run: bash scripts/check-schema-drift.sh

      - name: pgTAP (day closing, credit, RLS)
        if: steps.changes.outputs.db == 'true'
        run: bash scripts/test-db.sh

      - name: types/db.d.ts matches schema.sql
        if: steps.changes.outputs.db == 'true'
        run: bash scripts/gen-db-types.sh --check
