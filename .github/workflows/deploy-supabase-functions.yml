name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy functions (${{ github.ref_name == 'staging' && 'staging' || 'prod' }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'staging' && 'staging' || 'prod' }}
    steps:
      - uses: actions/checkout@v7

      # Pinned: "latest" makes runs unreproducible and hits the GitHub API rate limit.
      - uses: supabase/setup-cli@v3
        with:
          version: "2.122.1"

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set in the GitHub environment." >&2
            exit 1
          fi
          # Every folder with an index.ts is a function; _shared is imported code, not a function.
          deployed=0
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            [[ "$fn" == _* || ! -f "${dir}index.ts" ]] && continue
            echo "Deploying ${fn}…"
            supabase functions deploy "${fn}" --project-ref "${SUPABASE_PROJECT_REF}"
            deployed=$((deployed + 1))
          done
          echo "Deployed ${deployed} function(s)." >> "$GITHUB_STEP_SUMMARY"
