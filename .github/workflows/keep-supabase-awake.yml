name: Keep Supabase awake

# Free Supabase projects pause after about a week with no database activity.
# Every 3 days, send one anonymous PostgREST read to prod and staging. RLS
# returns no rows (or a permission error) to the anon key, but Postgres still
# runs the statement, which counts as activity. No data is read or written.

on:
  schedule:
    # 04:10 UTC on the 1st, 4th, 7th, … of each month (gap is never more than 4 days)
    - cron: "10 4 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [prod, staging]
    environment: ${{ matrix.target }}
    steps:
      - name: One trivial query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY missing in environment ${{ matrix.target }}" >&2
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/pump_settings?select=id&limit=1" || echo 000)"
          echo "HTTP ${status}"
          # 2xx/4xx: the database answered. 5xx/000: unreachable or paused.
          if [[ "${status}" == 000 || "${status}" =~ ^5 ]]; then
            echo "Database did not answer. If the project is paused, restore it in the Supabase dashboard." >&2
            exit 1
          fi
