name: Check DNS siblings

# Sole scheduled DNS safety net for sibling *.fnsventures.in Pages hosts.
# Canonical script + reusable job live in this repo; fns-cashline calls the
# reusable workflow on demand only (no second cron).

on:
  schedule:
    # Hourly — catch registrar mistakes before the next shift, not next day
    - cron: "20 * * * *"
  workflow_dispatch:

concurrency:
  group: check-dns-siblings
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: DNS + env.js (auto-fix)
    uses: ./.github/workflows/reusable-check-dns-siblings.yml
    secrets:
      GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
      GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
